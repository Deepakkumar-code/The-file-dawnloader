<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The File Downloader</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial;
  color: white;
  text-align: center;
  overflow: hidden;
  background: url('https://images.unsplash.com/photo-1605902711622-cfb43c4437d1') no-repeat center center/cover;
}

/* Dark overlay */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  top: 0;
  left: 0;
  z-index: 0;
}

/* ===== LOADING SCREEN ===== */
#loader {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
}

/* Spinner */
.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #222;
  border-top: 6px solid #00ffcc;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  box-shadow: 0 0 20px #00ffcc;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

.loading-text {
  margin-top: 20px;
  font-size: 18px;
  color: #00ffcc;
  letter-spacing: 2px;
}

/* Stars */
.stars::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  box-shadow:
    50px 100px white, 150px 200px white, 300px 400px white,
    500px 600px white, 700px 800px white, 900px 100px white,
    1100px 300px white, 1300px 500px white;
  animation: blink 2s infinite alternate;
}

@keyframes blink {
  from {opacity: 0.3;}
  to {opacity: 1;}
}

.container {
  position: relative;
  z-index: 1;
  margin-top: 120px;
  display: none;
}

h1 {
  font-size: 42px;
  text-shadow: 0 0 15px #00ffcc;
}

.download-btn {
  display: inline-block;
  padding: 15px 35px;
  margin-top: 30px;
  background: #00ffcc;
  color: black;
  text-decoration: none;
  font-size: 18px;
  border-radius: 12px;
  transition: 0.3s;
  box-shadow: 0 0 15px #00ffcc;
}

.download-btn:hover {
  background: white;
  transform: scale(1.1);
}
</style>
</head>

<body>

<!-- Loader -->
<div id="loader">
  <div class="spinner"></div>
  <div class="loading-text">LOADING...</div>
</div>

<div class="stars"></div>

<div class="container" id="mainContent">
  <h1>📂 The File Downloader</h1>
  <p>Download your gaming files easily</p>

  <a href="PASTE_YOUR_LINK_HERE" class="download-btn" target="_blank">
    ⬇ Download Now
  </a>
</div>

<script>
setTimeout(() => {
  document.getElementById("loader").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
}, 2500);
</script>

</body>
</html>
